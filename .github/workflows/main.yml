name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel pyinstaller PyQt5 pywin32 requests cryptography certifi Pillow

      - name: Build Picture to Icon
        run: |
          @'
          import os
          from PIL import Image

          icon_found = None
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.lower().endswith(('.png', '.ico')) and 'icon' in f.lower():
                      icon_found = os.path.join(root, f)
                      break
              if icon_found:
                  break

          if icon_found and icon_found.endswith('.png'):
              try:
                  img = Image.open(icon_found)
                  img.save("udsclient
