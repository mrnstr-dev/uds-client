name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Repository Contents
        run: |
          Write-Host "--- ALL REPOSITORY FILES ---"
          Get-ChildItem -Recurse -File | Select-Object FullName

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: python -m pip install --upgrade pip wheel pyinstaller PyQt5 pywin32 requests cryptography certifi Pillow

      - name: Build Picture to Icon
        run: python -c "import os; from PIL import Image; icon_found=next((os.path.join(r,f) for r,d,fs in os.walk('.') for f in fs if f.lower().endswith(('.png','.ico')) and 'icon' in f.lower()), None); img=Image.open(icon_found).resize((256,256)) if icon_found and icon_found.endswith('.png') else Image.new('RGBA',(64,64),(30,144,255,255)); img.save('udsclient.ico', format='ICO')"

      - name: Generate PyInstaller Build
        run: |
          python -c "
          import os, sys, subprocess
          print('Current working directory:', os.getcwd())
          all_files = []
          for root, dirs, files in os.walk('.'):
              for f in files:
                  all_files.append(os.path.join(root, f))
          
          print('Total files in repo:', len(all_files))
          py_files = [f for f in all_files if f.endswith('.py') and not any(x in f for x in ['.git', 'build', 'dist', 'output', 'venv'])]
          print('Found Python files:', py_files)

          if not py_files:
              print('ERROR: No python files found anywhere in the repository workspace!')
              sys.exit(1)

          # Ищем приоритетные имена или берем первый попавшийся
          target = None
          for f in py_files:
              if any(name in f.lower() for name in ['client', 'main', 'uds', 'run']):
                  target = f
                  break
          if not target:
              target = py_files[0]

          print(f'Selected target for PyInstaller: {target}')

          cmd = [
              'pyinstaller', '--clean', '--console', '--onedir', '--name', 'udsclient',
              '--icon', 'udsclient.ico', '--paths', '.',
              '--hidden-import', 'win32crypt', '--hidden-import', 'win32api', '--hidden-import', 'win32con',
              '--hidden-import', 'PyQt5', '--hidden-import', 'PyQt5.QtCore', '--hidden-import', 'PyQt5.QtWidgets',
              '--hidden-import', 'PyQt5.QtGui', '--hidden-import', 'PyQt5.QtNetwork',
              '--hidden-import', 'requests', '--hidden-import', 'cryptography', '--hidden-import', 'certifi',
              target
          ]
          subprocess.check_call(cmd)
          "

          if (-not (Test-Path "dist/udsclient/udsclient.exe")) {
              throw "dist/udsclient/udsclient.exe was not created."
          }

      - name: Install NSIS and Build Installer
        run: |
          choco install nsis --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path output
          
          $nsiScript = @"
          !include "MUI2.nsh"
          Name "OpenUDS Client"
          OutFile "output\UDSClientSetup-4.0.0.exe"
          InstallDir "`$PROGRAMFILES64\OpenUDS Client"
          RequestExecutionLevel admin

          !define MUI_ABORTWARNING
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_LANGUAGE "English"

          Section "MainSection" SEC01
            SetOutPath "`$INSTDIR"
            File /r "dist\udsclient\*.*"

            WriteRegStr HKCR "uds" "" "URL:OpenUDS Protocol"
            WriteRegStr HKCR "uds" "URL Protocol" ""
            WriteRegStr HKCR "uds\DefaultIcon" "" "`$INSTDIR\udsclient.exe,0"
            WriteRegStr HKCR "uds\shell\open\command" "" '"`$INSTDIR\udsclient.exe" "%1"'

            WriteRegStr HKCR "udss" "" "URL:OpenUDS Protocol"
            WriteRegStr HKCR "udss" "URL Protocol" ""
            WriteRegStr HKCR "udss\DefaultIcon" "" "`$INSTDIR\udsclient.exe,0"
            WriteRegStr HKCR "udss\shell\open\command" "" '"`$INSTDIR\udsclient.exe" "%1"'

            WriteUninstaller "`$INSTDIR\Uninstall.exe"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenUDSClient" "DisplayName" "OpenUDS Client"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenUDSClient" "UninstallString" '"`$INSTDIR\Uninstall.exe"'
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenUDSClient" "DisplayVersion" "4.0.0"
          SectionEnd

          Section "Uninstall"
            DeleteRegKey HKCR "uds"
            DeleteRegKey HKCR "udss"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenUDSClient"
            RMDir /r "`$INSTDIR"
          SectionEnd
          "@

          Set-Content -Path "installer.nsi" -Value $nsiScript -Encoding UTF8
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

          if (-not (Test-Path "output/UDSClientSetup-4.0.0.exe")) {
              throw "NSIS failed to generate output/UDSClientSetup-4.0.0.exe"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UDSClientSetup-4.0.0
          path: output/UDSClientSetup-4.0.0.exe
