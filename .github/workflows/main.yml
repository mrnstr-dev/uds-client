name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel pyinstaller PyQt5 pywin32 requests cryptography certifi Pillow

      - name: Build Picture to Icon
        run: |
          @'
          import os
          from PIL import Image

          icon_found = None
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.lower().endswith(('.png', '.ico')) and 'icon' in f.lower():
                      icon_found = os.path.join(root, f)
                      break
              if icon_found:
                  break

          if icon_found and icon_found.endswith('.png'):
              try:
                  img = Image.open(icon_found)
                  img.save("udsclient.ico", format="ICO", sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
                  print("Icon converted from " + icon_found)
              except Exception:
                  icon_found = None

          if not icon_found or not os.path.exists("udsclient.ico"):
              img = Image.new("RGBA", (64, 64), color=(30, 144, 255, 255))
              img.save("udsclient.ico", format="ICO")
              print("Default fallback icon generated")
          '@ | Set-Content -Path make_icon.py -Encoding UTF8
          python make_icon.py

      - name: Find Entry Point and Generate PyInstaller Build
        run: |
          Write-Host "Searching for Python entry point..."
          $pyFiles = Get-ChildItem -Recurse -Filter "*.py" \vert{} Where-Object { $_.FullName -notmatch "venv|\.git|build|dist" }
          
          # Ищем файл, похожий на клиент или основную точку входа
          $targetFile = ($pyFiles \vert{} Where-Object {$_.Name -match "client|main|uds" } | Select-Object -First 1).FullName
          
          if (-not $targetFile) {
              # Если специфичный не найден, берем первый попавшийся .py в корне или src
              $targetFile = ($pyFiles | Select-Object -First 1).FullName
          }

          if (-not $targetFile) {
              throw "No Python entry point found in the repository!"
          }

          Write-Host "Using entry point: $targetFile"

          pyinstaller --clean --console --onedir --name udsclient `
            --icon "udsclient.ico" `
            --paths "." `
            --hidden-import win32crypt `
            --hidden-import win32api `
            --hidden-import win32con `
            --hidden-import PyQt5 `
            --hidden-import PyQt5.QtCore `
            --hidden-import PyQt5.QtWidgets `
            --hidden-import PyQt5.QtGui `
            --hidden-import PyQt5.QtNetwork `
            --hidden-import requests `
            --hidden-import cryptography `
            --hidden-import certifi `
            $targetFile

          if (-not (Test-Path "dist/udsclient/udsclient.exe")) {
              throw "dist/udsclient/udsclient.exe was not created."
          }

      - name: Install NSIS
        run: |
          choco install nsis --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build NSIS Installer
        run: |
          New-Item -ItemType Directory -Force -Path output

          $nsiScript = @'
          !include "MUI2.nsh"
          Name "OpenUDS Client"
          OutFile "output\UDSClientSetup-4.0.0.exe"
          InstallDir "$PROGRAMFILES64\OpenUDS Client"
          RequestExecutionLevel admin

          !define MUI_ABORTWARNING
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_LANGUAGE "English"

          Section "MainSection" SEC01
            SetOutPath "$INSTDIR"
            File /r "dist\udsclient\*.*"

            WriteRegStr HKCR "uds" "" "URL:OpenUDS Protocol"
            WriteRegStr HKCR "uds" "URL Protocol" ""
            WriteRegStr HKCR "uds\DefaultIcon" "" "$INSTDIR\udsclient.exe,0"
            WriteRegStr HKCR "uds\shell\open\command" "" '"$INSTDIR\udsclient.exe" "%1"'

            WriteRegStr HKCR "udss" "" "URL:OpenUDS Protocol"
            WriteRegStr HKCR "udss" "URL Protocol" ""
            WriteRegStr HKCR "udss\DefaultIcon" "" "$INSTDIR\udsclient.exe,0"
            WriteRegStr HKCR "udss\shell\open\command" "" '"$INSTDIR\udsclient.exe" "%1"'

            WriteUninstaller "$INSTDIR\Uninstall.exe"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenUDSClient" "DisplayName" "OpenUDS Client"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenUDSClient" "UninstallString" '"$INSTDIR\Uninstall.exe"'
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenUDSClient" "DisplayVersion" "4.0.0"
          SectionEnd

          Section "Uninstall"
            DeleteRegKey HKCR "uds"
            DeleteRegKey HKCR "udss"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenUDSClient"
            RMDir /r "$INSTDIR"
          SectionEnd
          '@

          Set-Content -Path "installer.nsi" -Value $nsiScript -Encoding UTF8
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

          if (-not (Test-Path "output/UDSClientSetup-4.0.0.exe")) {
              throw "NSIS failed to generate output/UDSClientSetup-4.0.0.exe"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UDSClientSetup-4.0.0
          path: output/UDSClientSetup-4.0.0.exe
