name: Build UDS Clients

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect repository tree
        shell: pwsh
        run: |
          Write-Host "=== Структура репозитория ==="
          Get-ChildItem -Recurse -Depth 2 | Select-Object FullName

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller wheel
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install PyQt5 requests cryptography certifi

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress

      - name: Build Executable via PyInstaller
        shell: pwsh
        run: |
          # Определяем точный путь к главному скрипту
          $entryScript = ""
          if (Test-Path "src/udsclient.py") {
              $entryScript = "src/udsclient.py"
          } elseif (Test-Path "udsclient.py") {
              $entryScript = "udsclient.py"
          } elseif (Test-Path "src/udsclient") {
              Copy-Item "src/udsclient" "src/udsclient.py"
              $entryScript = "src/udsclient.py"
          } else {
              $found = Get-ChildItem -Recurse -Filter "*udsclient*.py" | Select-Object -First 1
              if ($found) { $entryScript = $found.FullName }
          }

          Write-Host "Используем точку входа: $entryScript"

          # Запуск сборки с добавлением src в пути поиска модулей
          pyinstaller --noconsole --onedir --name udsclient `
            --paths "src" `
            --add-data "src;src" `
            $entryScript

          if (-not (Test-Path "dist/udsclient/udsclient.exe")) {
              throw "PyInstaller не создал dist/udsclient/udsclient.exe"
          }

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output

          # Создаем конфигурационный скрипт инсталлятора
          @"
          [Setup]
          AppName=OpenUDS Client
          AppVersion=4.0.0
          DefaultDirName={autopf}\OpenUDS Client
          DefaultGroupName=OpenUDS
          OutputDir=output
          OutputBaseFilename=UDSClientSetup-4.0.0
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin

          [Files]
          Source: "dist\udsclient\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Registry]
          Root: HKCR; Subkey: "uds"; ValueType: string; ValueData: "URL:OpenUDS Protocol"; Flags: uninsdeletekey
          Root: HKCR; Subkey: "uds"; ValueName: "URL Protocol"; ValueType: string; ValueData: ""
          Root: HKCR; Subkey: "uds\DefaultIcon"; ValueType: string; ValueData: "{app}\udsclient.exe,0"
          Root: HKCR; Subkey: "uds\shell\open\command"; ValueType: string; ValueData: """{app}\udsclient.exe"" ""%1"""

          Root: HKCR; Subkey: "udss"; ValueType: string; ValueData: "URL:OpenUDS Protocol"; Flags: uninsdeletekey
          Root: HKCR; Subkey: "udss"; ValueName: "URL Protocol"; ValueType: string; ValueData: ""
          Root: HKCR; Subkey: "udss\DefaultIcon"; ValueType: string; ValueData: "{app}\udsclient.exe,0"
          Root: HKCR; Subkey: "udss\shell\open\command"; ValueType: string; ValueData: """{app}\udsclient.exe"" ""%1"""
          "@ | Set-Content -Path dynamic_setup.iss -Encoding UTF8

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" dynamic_setup.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UDSClientSetup-4.0.0
          path: output/UDSClientSetup-4.0.0.exe
