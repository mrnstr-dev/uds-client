name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel pyinstaller PyQt5 requests cryptography certifi Pillow

      - name: Build Picture to Icon
        run: |
          @'
          import os
          from PIL import Image

          candidates = [
              "src/uds/static/modern/img/udsicon.png",
              "src/udsclient/media/udsicon.png",
              "src/udsclient/media/icon.png",
              "src/media/icon.png",
              "media/icon.png",
              "udsicon.png"
          ]
          found = None
          for path in candidates:
              if os.path.exists(path):
                  found = path
                  break

          if found:
              img = Image.open(found)
              img.save("udsclient.ico", format="ICO", sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
              print(f"Icon built successfully from {found}")
          else:
              img = Image.new("RGBA", (64, 64), color=(0, 120, 215, 255))
              img.save("udsclient.ico", format="ICO")
              print("Default icon generated")
          '@ | Set-Content -Path make_icon.py -Encoding UTF8
          python make_icon.py

      - name: Create PyInstaller Spec File
        run: |
          $entry = ""
          if (Test-Path "src/udsclient.py") { 
              $entry = "src/udsclient.py" 
          } elseif (Test-Path "udsclient.py") { 
              $entry = "udsclient.py" 
          } elseif (Test-Path "src/udsclient/client.py") { 
              $entry = "src/udsclient/client.py" 
          } elseif (Test-Path "src/udsclient") {
              Copy-Item "src/udsclient" "src/udsclient.py"
              $entry = "src/udsclient.py"
          } else {
              $found = Get-ChildItem -Recurse -Filter "*udsclient*.py" | Select-Object -First 1
              if ($found) {$entry = $found.FullName } else {$entry = "src/udsclient.py" }
          }
          Write-Host "Используется точка входа: $entry"
          pyi-makespec --noconsole --onedir --name udsclient --icon "udsclient.ico" --paths "src" $entry

      - name: Generate PyInstaller build
        run: |
          pyinstaller --clean udsclient.spec
          if (-not (Test-Path "dist/udsclient/udsclient.exe")) {
              throw "Бинарный файл dist/udsclient/udsclient.exe не был создан."
          }

      - name: Extract version from Python file
        run: |
          $version = "4.0.0"
          $verFiles = Get-ChildItem -Recurse -Filter "*version*.py"
          foreach ($f in$verFiles) {
              $match = Select-String -Path$f.FullName -Pattern '(__version__|VERSION)\s*=\s*["'']([^"'']+)["'']'
              if ($match) {
                  $version =$match.Matches.Groups[2].Value
                  break
              }
          }
          Write-Host "Определена версия: $version"
          "APP_VERSION=$version" \vert{} Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install NSIS
        run: |
          choco install nsis --no-progress
          "C:\Program Files (x86)\NSIS
