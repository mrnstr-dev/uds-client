- name: Inspect Repo Structure
        run: |
          Get-ChildItem -Recurse -File | Select-Object FullName

      - name: Create Dedicated Entry Point
        run: |
          @'
          import sys
          import os
          import traceback

          current_dir = os.path.dirname(os.path.abspath(__file__))
          src_dir = os.path.join(current_dir, 'src')
          for p in [current_dir, src_dir]:
              if os.path.isdir(p) and p not in sys.path:
                  sys.path.insert(0, p)

          print(f"[UDS Debug] Python version: {sys.version}")
          print(f"[UDS Debug] Arguments: {sys.argv}")
          print(f"[UDS Debug] Current dir: {current_dir}")

          started = False
          errors = []
          targets = [
              ('udsclient.client', 'main'),
              ('udsclient.__main__', 'main'),
              ('udsclient.main', 'main'),
              ('udsclient', 'main'),
              ('uds.client', 'main'),
              ('uds', 'main'),
              ('udsclient3.client', 'main'),
              ('udsclient3', 'main')
          ]

          for mod_name, func_name in targets:
              try:
                  m = __import__(mod_name, fromlist=[func_name])
                  if hasattr(m, func_name):
                      print(f"[UDS Debug] Found target: {mod_name}.{func_name}, launching...")
                      getattr(m, func_name)()
                      started = True
                      break
              except Exception as e:
                  errors.append(f"{mod_name}: {traceback.format_exc()}")

          if not started:
              print("\n" + "="*50)
              print("CRITICAL ERROR: Failed to launch UDS Client entry point!")
              print("="*50)
              for err in errors:
                  print(err)
              print("="*50)
              input("\nPress ENTER to close this window...")
              sys.exit(1)
          '@ | Set-Content -Path entry.py -Encoding UTF8

      - name: Generate PyInstaller build
        run: |
          pyinstaller --clean --console --onedir --name udsclient `
            --icon "udsclient.ico" `
            --paths "." --paths "src" `
            --hidden-import PyQt5 `
            --hidden-import PyQt5.QtCore `
            --hidden-import PyQt5.QtWidgets `
            --hidden-import PyQt5.QtGui `
            --hidden-import PyQt5.QtNetwork `
            --hidden-import requests `
            --hidden-import cryptography `
            --hidden-import certifi `
            entry.py

          if (-not (Test-Path "dist/udsclient/udsclient.exe")) {
              throw "dist/udsclient/udsclient.exe was not created."
          }
